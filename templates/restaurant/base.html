{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Little Lemon{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'restaurant/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'book_table' %}"><span class="lemon-mark">●</span> Little Lemon</a>
    <nav><a href="{% url 'book_table' %}">Book a table</a><a href="{% url 'reservations_page' %}">Reservations</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Little Lemon · Fresh food, memorable moments</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
